name: Audit Go Race and Coverage

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-race-coverage:
    name: Go 1.27.1 race and coverage
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go 1.27.1
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          check-latest: true
          cache: true

      - name: Verify exact Go toolchain
        shell: bash
        run: |
          actual="$(go version)"
          echo "$actual"
          test "$actual" = "go version go1.27.1 linux/amd64"

      - name: Run race tests with coverage
        run: go test -race -coverprofile=coverage.out ./...

      - name: Print coverage summary
        run: go tool cover -func=coverage.out

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: go-race-coverage
          path: coverage.out
          if-no-files-found: error
