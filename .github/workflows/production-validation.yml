name: Production Validation

on:
  push:
    branches: ["main", "phase-7-production-integration"]
  pull_request:
    branches: ["main", "phase-7-production-integration"]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race ./...
      - name: Install Go security analyzers
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          go install honnef.co/go/tools/cmd/staticcheck@latest
          go install github.com/securego/gosec/v2/cmd/gosec@latest
      - run: govulncheck ./...
      - run: staticcheck ./...
      - run: gosec ./...

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m pytest -q
      - run: python -m compileall -q .
      - run: python -m pip install pip-audit bandit
      - run: pip-audit -r requirements.lock.txt
      - run: bandit -r blockchain api cli config -q
